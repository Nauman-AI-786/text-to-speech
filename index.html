<!DOCTYPE html>
<html lang="ur">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Voice Studio – Free Text to Speech</title>
  <meta name="description" content="100% Free AI Text to Speech. Urdu, Hindi, English voices. No signup required." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <!-- Header -->
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🎙️</span>
        <div>
          <h1>AI Voice Studio</h1>
          <p class="tagline">Free • Browser-based • No signup</p>
        </div>
      </div>
      <button id="themeToggle" class="theme-btn" title="Toggle theme">🌙</button>
    </header>

    <!-- Main Card -->
    <main class="card">
      <div class="textarea-wrap">
        <textarea 
          id="textInput" 
          placeholder="Yahan text likhein... (Urdu, Hindi ya English)"
          rows="7"
        ></textarea>
        <div class="char-count">
          <span id="charCount">0</span> characters
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <div class="control-group">
          <label for="voiceSelect">Voice</label>
          <select id="voiceSelect"></select>
        </div>

        <div class="control-group">
          <label for="rateRange">Speed <span id="rateValue">1.0x</span></label>
          <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1" />
        </div>

        <div class="control-group">
          <label for="pitchRange">Pitch <span id="pitchValue">1.0</span></label>
          <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1" />
        </div>

        <div class="control-group">
          <label for="volumeRange">Volume <span id="volumeValue">100%</span></label>
          <input type="range" id="volumeRange" min="0" max="1" step="0.1" value="1" />
        </div>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button id="speakBtn" class="btn btn-primary">
          <span>🔊</span> Speak
        </button>
        <button id="pauseBtn" class="btn btn-secondary" disabled>
          <span>⏸️</span> Pause
        </button>
        <button id="resumeBtn" class="btn btn-secondary" disabled>
          <span>▶️</span> Resume
        </button>
        <button id="stopBtn" class="btn btn-danger" disabled>
          <span>⏹️</span> Stop
        </button>
      </div>

      <!-- Status -->
      <div id="status" class="status"></div>

      <!-- Note -->
      <div class="note">
        <strong>Note:</strong> Browser ke Text-to-Speech se direct MP3 download possible nahi hota (security limit). 
        Aap text sun sakte ho. High quality download ke liye Edge / Chrome recommended.
      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>Made with ❤️ • 100% Free • Works offline after first load</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
