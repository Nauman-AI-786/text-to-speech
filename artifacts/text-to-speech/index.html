  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Custom Text to Speech Controls -->
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h3>AI Custom Controls</h3>
  
  <!-- Language and Voice Selection -->
  <label>Aawaz aur Zabaan Chunein:</label>
  <select id="voiceSelect" style="width: 100%; padding: 8px; margin: 10px 0; border-radius: 4px;"></select>
  
  <!-- Speed Control -->
  <label>Speed (Raftaar):</label>
  <input type="range" id="rateRange" min="0.5" max="2" value="1" step="0.1" style="width: 100%; margin: 10px 0;">
  
  <!-- Pitch Control -->
  <label>Pitch (Bhari ya Barik Aawaz):</label>
  <input type="range" id="pitchRange" min="0.5" max="2" value="1" step="0.1" style="width: 100%; margin: 10px 0;">
  
  <!-- Download Button -->
  <button id="downloadAudioBtn" style="width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">
    ⬇️ MP3 Audio Download Karein
  </button>
</div>
    <!-- Final Synchronized TTS Controller Script -->
<script>
  window.addEventListener('DOMContentLoaded', () => {
    // 2 second ka delay taake Replit ka main UI sahi tarah load ho jaye
    setTimeout(() => {
      const synth = window.speechSynthesis;
      const voiceSelect = document.getElementById('voiceSelect');
      const rateRange = document.getElementById('rateRange');
      const pitchRange = document.getElementById('pitchRange');
      const downloadBtn = document.getElementById('downloadAudioBtn');
      let voices = [];

      if (!voiceSelect || !downloadBtn) {
        console.log("UI Elements load nahi huay, reload karein.");
        return;
      }

      function populateVoiceList() {
        voices = synth.getVoices();
        if (voices.length === 0) return;

        voiceSelect.innerHTML = '';
        voices.forEach((voice) => {
          const option = document.createElement('option');
          option.textContent = `${voice.name} (${voice.lang})`;
          option.setAttribute('data-lang', voice.lang);
          option.setAttribute('data-name', voice.name);
          
          if (voice.lang.includes('ur') || voice.lang.includes('hi')) {
            option.selected = true;
          }
          voiceSelect.appendChild(option);
        });
      }

      populateVoiceList();
      if (synth.onvoiceschanged !== undefined) {
        synth.onvoiceschanged = populateVoiceList;
      }
      setInterval(populateVoiceList, 1000); // Har second check karega jab tak load na hon

      downloadBtn.addEventListener('click', () => {
        // Replit ka main textarea dhoondna
        const textInput = document.querySelector('textarea') || document.querySelector('.w-full') || document.querySelector('input[type="text"]');
        
        if (!textInput || !textInput.value.trim()) {
          alert("Pehle upar diye gaye main box me kuch text likhein!");
          return;
        }

        const text = textInput.value;
        const selectedOption = voiceSelect.selectedOptions[0]; // Fixed here [0]
        if (!selectedOption) {
          alert("Aawazein load ho rahi hain, please thoda rukh kar click karein.");
          return;
        }
        
        const selectedVoiceName = selectedOption.getAttribute('data-name');
        const speed = parseFloat(rateRange.value);
        const pitch = parseFloat(pitchRange.value);

        const utterance = new SpeechSynthesisUtterance(text);
        const targetVoice = voices.find(v => v.name === selectedVoiceName);
        if (targetVoice) utterance.voice = targetVoice;
        utterance.rate = speed;
        utterance.pitch = pitch;

        alert("Converting... Audio file download ho rahi hai!");
        synth.speak(utterance);

        // Google TTS integration download ke liye
        const encodedText = encodeURIComponent(text);
        const langCode = selectedOption.getAttribute('data-lang') || 'ur-PK';
        const audioUrl = `https://google.com{langCode}&client=tw-ob&q=${encodedText}`;

        const link = document.createElement('a');
        link.href = audioUrl;
        link.target = '_blank';
        link.download = "AI-Voice.mp3";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      });
    }, 2000); // 2 second ka wait
  });
</script>

  </body>
</html>
