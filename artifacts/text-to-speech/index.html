  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Fixed Mobile Friendly AI Voice Downloader -->
<div style="max-width: 500px; margin: 30px auto; padding: 25px; background: #0f172a; border-radius: 12px; font-family: system-ui, sans-serif; color: #fff; text-align: center; border: 1px solid #1e293b; box-shadow: 0 4px 20px rgba(0,0,0,0.4);">
  <h3 style="margin-top:0; color:#38bdf8; font-size: 22px;">🎙️ AI Voice Downloader</h3>
  <p style="font-size: 13px; color: #94a3b8; margin-bottom: 20px;">Text likhein aur bina page reset hue direct audio download karein!</p>
  
  <textarea id="myCustomText" placeholder="Yahan apna Urdu ya English text likhein..." style="width: 100%; height: 110px; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; resize: none; font-size: 15px; box-sizing: border-box;"></textarea>
  
  <div style="text-align: left; margin: 15px 0;">
    <label style="font-size: 13px; color: #cbd5e1; font-weight: 500;">Zabaan (Language) Chunein:</label>
    <select id="myCustomLang" style="width: 100%; padding: 12px; margin-top: 5px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; font-size: 15px;">
      <option value="ur-PK" selected>🇵🇰 Urdu (Pakistan)</option>
      <option value="hi-IN">🇮🇳 Hindi (India)</option>
      <option value="en-US">🇺🇸 English (US)</option>
      <option value="en-GB">🇬🇧 English (UK)</option>
    </select>
  </div>

  <button id="myDownloadBtn" style="width: 100%; background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.2s;">
    ⬇️ MP3 Audio Download Karein
  </button>
</div>

<script>
  document.getElementById('myDownloadBtn').addEventListener('click', (e) => {
    e.preventDefault(); 

    const textInput = document.getElementById('myCustomText');
    const langSelect = document.getElementById('myCustomLang');
    
    const text = textInput.value.trim();
    const lang = langSelect.value; 
    
    if (!text) {
      alert("Pehle box me kuch text likhein!");
      return;
    }

    const encodedText = encodeURIComponent(text);
    const audioUrl = `https://google.com{lang}&client=tw-ob&q=${encodedText}`;

    alert("Converting... Aap ki select ki hui language me audio ready ho rahi hai!");

    const link = document.createElement('a');
    link.href = audioUrl;
    link.target = '_blank';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>

  </body>
