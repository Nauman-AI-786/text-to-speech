  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Custom Text to Speech Controls -->
<div style="max-width: 500px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; font-family: sans-serif;">
  <h3>AI Custom Controls</h3>
  
  <!-- Language and Voice Selection -->
  <label>Aawaz aur Zabaan Chunein:</label>
  <select id="voiceSelect" style="width: 100%; padding: 8px; margin: 10px 0; border-radius: 4px;"></select>
  
  <!-- Speed Control -->
  <label>Speed (Raftaar):</label>
  <input type="range" id="rateRange" min="0.5" max="2" value="1" step="0.1" style="width: 100%; margin: 10px 0;">
  
  <!-- Pitch Control -->
  <label>Pitch (Bhari ya Barik Aawaz):</label>
  <input type="range" id="pitchRange" min="0.5" max="2" value="1" step="0.1" style="width: 100%; margin: 10px 0;">
  
  <!-- Download Button -->
  <button id="downloadAudioBtn" style="width: 100%; background-color: #28a745; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;">
    ⬇️ MP3 Audio Download Karein
  </button>
</div>
    <!-- Advanced Text to Speech Controller Script -->
<script>
  // Browser ke Speech API aur UI elements ko jorna
  const synth = window.speechSynthesis;
  const voiceSelect = document.getElementById('voiceSelect');
  const rateRange = document.getElementById('rateRange');
  const pitchRange = document.getElementById('pitchRange');
  const downloadBtn = document.getElementById('downloadAudioBtn');
  let voices = [];

  // 1. Browser se Urdu, Hindi aur saari international aawazein nikalna
  function populateVoiceList() {
    voices = synth.getVoices();
    if (voices.length === 0) return; // Agar abhi tak load nahi hueen to rukh jayein

    voiceSelect.innerHTML = ''; // Purani list saaf karein
    
    voices.forEach((voice) => {
      const option = document.createElement('option');
      option.textContent = `${voice.name} (${voice.lang})`;
      option.setAttribute('data-lang', voice.lang);
      option.setAttribute('data-name', voice.name);
      
      // Urdu (ur) ya Hindi (hi) ko automatic pehle se select rakhna
      if (voice.lang.includes('ur') || voice.lang.includes('hi')) {
        option.selected = true;
      }
      voiceSelect.appendChild(option);
    });
  }

  // Google Chrome aur mobile browsers me voices late load hoti hain, is liye ye checks zaroori hain
  populateVoiceList();
  if (synth.onvoiceschanged !== undefined) {
    synth.onvoiceschanged = populateVoiceList;
  }
  // Safe side ke liye 1 second baad dobara check karein agar load na hui hon
  setTimeout(populateVoiceList, 1000);

  // 2. Real MP3/Audio Download Karne Ka Advance Logic
  downloadBtn.addEventListener('click', () => {
    // Replit ki main website ka original textarea dhoondna jahan user text likhta hai
    const textInput = document.querySelector('textarea') || document.querySelector('input[type="text"]');
    
    if (!textInput || !textInput.value.trim()) {
      alert("Pehle upar diye gaye main box me kuch Urdu ya English text likhein!");
      return;
    }

    const text = textInput.value;
    const selectedOption = voiceSelect.selectedOptions[0];
    if (!selectedOption) {
      alert("Abhi aawazein load ho rahi hain, please 2 second ruk kar dobara click karein.");
      return;
    }
    
    const selectedVoiceName = selectedOption.getAttribute('data-name');
    const speed = parseFloat(rateRange.value);
    const pitch = parseFloat(pitchRange.value);

    // Audio tayar karna sun'nay ke liye
    const utterance = new SpeechSynthesisUtterance(text);
    const targetVoice = voices.find(v => v.name === selectedVoiceName);
    if (targetVoice) utterance.voice = targetVoice;
    utterance.rate = speed;
    utterance.pitch = pitch;

    alert("Converting... Aap ki chuninda aawaz me audio file download ho rahi hai!");
    
    // Pehle user ko sunaayein
    synth.speak(utterance);

    // Ab is text ko real audio format me convert kar ke download karwana
    // Note: Google Text-to-Speech link API ka use kar ke real MP3 generate karna
    const encodedText = encodeURIComponent(text);
    const langCode = selectedOption.getAttribute('data-lang') || 'ur-PK';
    const audioUrl = `https://google.com{langCode}&client=tw-ob&q=${encodedText}`;

    // Browser me download trigger karna
    const link = document.createElement('a');
    link.href = audioUrl;
    link.target = '_blank'; // Khule tab me audio save karne ke liye
    link.download = "AI-Voice.mp3";
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  });
</script>
